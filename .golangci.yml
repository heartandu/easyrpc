version: "2"
output:
  formats:
    text:
      path: stdout
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - funcorder
    - ireturn
    - mnd
    - noinlineerr
    - nonamedreturns
    - varnamelen
    - wsl
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/spf13/viper.Viper).BindEnv
        - (*github.com/spf13/viper.Viper).BindPFlag
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 20
    goconst:
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    gocyclo:
      min-complexity: 20
    godox:
      keywords:
        - BUG
        - FIXME
    govet:
      disable:
        - fieldalignment
      enable-all: true
    nlreturn:
      block-size: 2
    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          arguments:
            - 120
        - name: deep-exit
          disabled: true
        - name: add-constant
          arguments:
            - allowFloats: 0.0,0.,1.0,1.,2.0,2.
              allowInts: 0,1,2
              allowStrs: '""'
              maxLitCount: "3"
        - name: cognitive-complexity
          arguments:
            - 20
        - name: unhandled-error
          arguments:
            - fmt.Fprintln
            - fmt.Fprintf
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    tagalign:
      sort: false
    tagliatelle:
      case:
        rules:
          yaml: snake
    testifylint:
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - err113
          - errcheck
          - forcetypeassert
          - funlen
          - gocyclo
          - gosec
          - lll
          - maintidx
          - revive
          - varnamelen
          - wrapcheck
        path: _test\.go
      - linters:
          - cyclop
          - gocognit
          - maintidx
          - paralleltest
          - testpackage
        path: test/
      - path: (.+)\.go$
        text: exported var Err(.+) should have comment( \(or a comment on this block\))? or be unexported
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/heartandu/easyrpc)
    goimports:
      local-prefixes:
        - github.com/heartandu/easyrpc
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
