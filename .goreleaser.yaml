# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: easyrpc

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - binary: easyrpc
    main: ./cmd/easyrpc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .Binary }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - vendor: heartandu
    homepage: https://github.com/heartandu/easyrpc/
    maintainer: heartandu
    description: EasyRPC is an easy-to-use gRPC client.
    license: MIT
    id: nfpms
    formats:
      - apk
      - deb
      - rpm

homebrew_casks:
  - name: easyrpc
    commit_author:
      name: heartandu
    homepage: https://github.com/heartandu/easyrpc/
    description: |
      EasyRPC is an easy-to-use gRPC client.
      Inspired by grpcurl and evans and aims to ease the process of querying protobuf RPCs from a terminal.
    license: MIT
    repository:
      name: homebrew-easyrpc
      owner: heartandu
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
